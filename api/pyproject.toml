[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialer-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis[hiredis]>=5.0",
    "celery[redis]>=5.4",
    "ESL>=1.1.0",              # FreeSWITCH Event Socket Library
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "phonenumbers>=8.13",      # phone number parsing + E.164 normalization
    "pandas>=2.2",             # CSV contact list parsing
    "aiofiles>=23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["dialer"]
