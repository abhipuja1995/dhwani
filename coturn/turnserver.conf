# coturn STUN/TURN server config
listening-port=3478
tls-listening-port=5349

# Allow all interfaces in dev; restrict to specific IP in prod
listening-ip=0.0.0.0

# Use static-auth-secret for time-limited TURN credentials
# The API generates credentials using the same secret
use-auth-secret
static-auth-secret=changeme_turn_secret

# Realm (must match what the WebRTC client sends)
realm=dialer.local

# TURN relay range (should not overlap FreeSWITCH RTP range 16384-32768)
min-port=49152
max-port=65535

# Security
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255

# Logging
log-file=/var/log/turnserver.log
verbose
